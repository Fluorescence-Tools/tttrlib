name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

env:
  DEFAULT_PYTHON: "3.10"
  CIBW_VERSION: "2.23.3"
  MAIN_PY_VERSIONS: "3.9 3.10 3.11 3.12 3.13"

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      is_main: ${{ steps.check.outputs.is_main }}
      cibw_build: ${{ steps.check.outputs.cibw_build }}
      py_versions: ${{ steps.check.outputs.py_versions }}
      py_matrix: ${{ steps.check.outputs.py_matrix }}
    steps:
      - id: check
        run: |
          BRANCH="${{ github.ref }}"
          if [[ "$BRANCH" == "refs/heads/main" || "$BRANCH" == "refs/heads/development" ]]; then
            echo "is_main=true" >> $GITHUB_OUTPUT
            BUILD_SPEC=$(python -c "print(' '.join('cp' + v.replace('.', '') + '-*' for v in '${{ env.MAIN_PY_VERSIONS }}'.split()))")
            echo "cibw_build=$BUILD_SPEC" >> $GITHUB_OUTPUT
            echo "py_versions=${{ env.MAIN_PY_VERSIONS }}" >> $GITHUB_OUTPUT
            echo 'py_matrix={"python":["3.9","3.10","3.11","3.12","3.13"]}' >> $GITHUB_OUTPUT
          else
            echo "is_main=false" >> $GITHUB_OUTPUT
            PY_VER_SHORT="${DEFAULT_PYTHON/./}"
            echo "cibw_build=cp${PY_VER_SHORT}-*" >> $GITHUB_OUTPUT
            echo "py_versions=${{ env.DEFAULT_PYTHON }}" >> $GITHUB_OUTPUT
            echo 'py_matrix={"python":["3.10"]}' >> $GITHUB_OUTPUT
          fi

  # ── Multi-language SWIG generation guard (Python + R + Java) ──────────────

  swig_multilang:
    name: SWIG multi-language check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y swig
      - name: Generate Python, R and Java wrappers
        run: ./tools/check_swig_multilang.sh

  # ── Build & test the R interface (FindR.cmake + rarrays.i marshalling) ────

  build_test_r_lnx:
    name: Build & test R interface (lnx)
    needs: swig_multilang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Pin R to a version compatible with the SWIG release on the runner.
      # SWIG's R runtime lags new R internals (e.g. R 4.6 made CHARACTER_POINTER
      # read-only and changed S4 macros), so avoid bleeding-edge "release".
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev swig cmake ninja-build
      - name: Configure and build R module
        run: |
          cmake -S . -B build-r -G Ninja \
            -DBUILD_PYTHON_INTERFACE=OFF \
            -DBUILD_R_INTERFACE=ON \
            -DBUILD_LIBRARY=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-r --target tttrlibR
      - name: Download reference test data
        run: |
          mkdir -p tttr-data/bh tttr-data/imaging/pq/ht3
          curl -sSL -o tttr-data/bh/bh_spc132.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc132.spc
          curl -sSL -o tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3 \
            https://www.peulen.xyz/downloads/tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3
      - name: Run R tests
        env:
          TTTRLIB_R_SO: ${{ github.workspace }}/build-r/ext/tttrlib.so
          TTTRLIB_R_WRAPPER: ${{ github.workspace }}/build-r/ext/tttrlib.R
          TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
        run: |
          Rscript test/r/test_tttr.R
          Rscript test/r/test_clsm.R
          Rscript test/r/test_decayfit.R
          Rscript test/r/test_pda.R

  # ── Build & test the Java interface (FindJNI + jarrays.i + JNI) ───────────

  build_test_java_lnx:
    name: Build & test Java interface (lnx)
    needs: swig_multilang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev swig cmake ninja-build
      - name: Configure and build JNI module
        run: |
          cmake -S . -B build-java -G Ninja \
            -DBUILD_PYTHON_INTERFACE=OFF \
            -DBUILD_JAVA_INTERFACE=ON \
            -DBUILD_LIBRARY=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-java --target tttrlibJava
      - name: Compile Java proxies + tests
        run: |
          cp ext/java/pkg/src/main/java/io/github/fluorescencetools/tttrlib/NativeLoader.java \
             build-java/java-pkg/src/main/java/io/github/fluorescencetools/tttrlib/
          javac -d build-java/java-classes \
            build-java/java-pkg/src/main/java/io/github/fluorescencetools/tttrlib/*.java
          javac -cp build-java/java-classes -d build-java/test-classes \
            test/java/TTTRSmokeTest.java test/java/CLSMTest.java test/java/LifetimeTest.java test/java/DecayFitTest.java test/java/PdaTest.java
      - name: Download reference test data
        run: |
          mkdir -p tttr-data/bh tttr-data/imaging/pq/ht3
          curl -sSL -o tttr-data/bh/bh_spc132.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc132.spc
          curl -sSL -o tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3 \
            https://www.peulen.xyz/downloads/tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3
      - name: Run Java tests
        env:
          TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
        run: |
          CP=build-java/java-classes:build-java/test-classes
          NATIVE=build-java/java-pkg/native
          java -cp $CP -Djava.library.path=$NATIVE TTTRSmokeTest
          java -cp $CP -Djava.library.path=$NATIVE CLSMTest
          java -cp $CP -Djava.library.path=$NATIVE LifetimeTest
          java -cp $CP -Djava.library.path=$NATIVE DecayFitTest
          java -cp $CP -Djava.library.path=$NATIVE PdaTest

  # ── ImageJ/Fiji plugin: build per-OS JNI native, assemble & release the JAR ──

  imagej_native:
    name: ImageJ native (${{ matrix.dir }})
    needs: [setup, swig_multilang]
    if: >-
      needs.setup.outputs.is_main == 'true' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  dir: linux-x86-64 }
          - { os: macos-15,       dir: darwin-x86-64 }
          - { os: macos-15,       dir: darwin-aarch64 }
          - { os: windows-2022,   dir: win32-x86-64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SWIG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swig cmake ninja-build
      - name: Install SWIG (macOS)
        if: runner.os == 'macOS'
        run: brew install swig ninja
      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        run: choco install swig ninja -y
      - name: Build JNI native (no HDF5 needed for PTU/HT3/SPC)
        run: |
          cmake -S . -B build-java -G Ninja -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_JAVA_INTERFACE=ON -DBUILD_LIBRARY=OFF -DBUILD_PHOTON_HDF=OFF -DWITH_AVX=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-java --target tttrlibJava
        shell: bash
      - name: Collect native + proxies
        shell: bash
        run: |
          mkdir -p stage/native/${{ matrix.dir }}
          # Name the native exactly as NativeLoader (System.mapLibraryName) expects,
          # so the bundled file is found on every platform (macOS wants .dylib, not .jnilib).
          case "${{ matrix.dir }}" in
            linux-*)  name=libtttrlibjni.so ;;
            darwin-*) name=libtttrlibjni.dylib ;;
            win32-*)  name=tttrlibjni.dll ;;
          esac
          src=$(find build-java \( -name 'libtttrlibjni*' -o -name 'tttrlibjni.dll' \) | head -1)
          cp "$src" "stage/native/${{ matrix.dir }}/$name"
          # the SWIG-generated .java proxies are identical across platforms; upload once (from Linux)
          if [ "${{ matrix.dir }}" = "linux-x86-64" ]; then
            mkdir -p stage/proxies
            cp build-java/java-pkg/src/main/java/io/github/fluorescencetools/tttrlib/*.java stage/proxies/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: imagej-${{ matrix.dir }}
          path: stage

  imagej_assemble:
    name: Assemble ImageJ plugin JAR (all platforms)
    needs: [setup, imagej_native]
    if: >-
      needs.setup.outputs.is_main == 'true' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          pattern: imagej-*
          path: dl
          merge-multiple: true
      - name: Assemble cross-platform fat JAR
        run: |
          # Version from pyproject; append short SHA for non-release builds.
          VER=$(python3 -c "import re;print(re.search(r'version\s*=\s*\"([^\"]+)\"',open('pyproject.toml').read()).group(1))")
          if [ "${{ github.event_name }}" != "release" ]; then VER="${VER}+$(git rev-parse --short HEAD)"; fi
          curl -sSL -o ij.jar https://repo1.maven.org/maven2/net/imagej/ij/1.54f/ij-1.54f.jar
          mkdir -p jarroot classes
          javac -cp ij.jar -d classes \
            dl/proxies/*.java \
            ext/java/pkg/src/main/java/io/github/fluorescencetools/tttrlib/NativeLoader.java \
            ext/java/imagej/src/main/java/io/github/fluorescencetools/tttrlib/imagej/*.java
          cp -r classes/* jarroot/
          cp ext/java/imagej/src/main/resources/plugins.config jarroot/
          cp -r dl/native jarroot/native            # native/{linux-x86-64,darwin-x86-64,darwin-aarch64,win32-x86-64}/
          ( cd jarroot && jar cf ../tttrlib_imagej-${VER}.jar . )
          echo "Bundled natives:"; ( cd jarroot && find native -type f )
          ls -la tttrlib_imagej-*.jar
      # Downloadable from any qualifying CI run (Actions ▸ run ▸ Artifacts).
      - uses: actions/upload-artifact@v4
        with:
          name: tttrlib-imagej-plugin
          path: tttrlib_imagej-*.jar
      # On a GitHub release, also attach the JAR as a release asset.
      - name: Upload JAR to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" tttrlib_imagej-*.jar --clobber

  # ── Quick smoke test for feature branches (no artifact builds) ────────────

  test_quick:
    name: Quick Test (lnx)
    needs: setup
    if: needs.setup.outputs.is_main == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev swig cmake
      - name: Cache test data
        id: cache
        uses: actions/cache@v4
        with:
          path: ./tttr-data
          key: tttr-test-data-${{ hashFiles('test/settings.json') }}
      - name: Download test data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pooch tqdm
          python test/download_test_data.py --output-dir ./tttr-data --quiet
      - name: Build and Test
        env:
          TTTRLIB_DATA: ./tttr-data
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pytest

  # ── Full builds + tests (main and development only) ───────────────────────

  download_test_data:
    name: Download Test Data
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Cache test data
        id: cache
        uses: actions/cache@v4
        with:
          path: ./tttr-data
          key: tttr-test-data-${{ hashFiles('test/settings.json') }}
      - name: Download test data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pooch tqdm
          python test/download_test_data.py --output-dir ./tttr-data --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
          retention-days: 1

  # ── Pip builds ────────────────────────────────────────────────────────────

  build_pip_lnx:
    name: Pip Build lnx
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install cibuildwheel==${{ env.CIBW_VERSION }} uv
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ needs.setup.outputs.cibw_build }}
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_* cp314-* cp314t-* cp313t-*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BUILD_FRONTEND: "build[uv]"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-wheels-ubuntu-latest
          path: ./wheelhouse/*.whl

  build_pip_osx_arm64:
    name: Pip Build osx arm64
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install cibuildwheel==${{ env.CIBW_VERSION }} uv
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ needs.setup.outputs.cibw_build }}
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_* cp314-* cp314t-* cp313t-*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ARCHS_MACOS: "arm64"
          MACOSX_DEPLOYMENT_TARGET: "26.0"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-wheels-macos-arm64
          path: ./wheelhouse/*.whl

  build_pip_osx_x86_64:
    name: Pip Build osx x86_64
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install cibuildwheel==${{ env.CIBW_VERSION }} uv
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ needs.setup.outputs.cibw_build }}
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_* cp314-* cp314t-* cp313t-*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ARCHS_MACOS: "x86_64"
          MACOSX_DEPLOYMENT_TARGET: "26.0"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-wheels-macos-x86_64
          path: ./wheelhouse/*.whl

  build_pip_win:
    name: Pip Build win
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    # Pin to windows-2022: on windows-latest (windows-2025) CMake's
    # "Visual Studio 17 2022" generator fails to discover the VS instance
    # ("could not find any instance of Visual Studio"). windows-2022 has a
    # discoverable VS 2022. (Conda builds are unaffected — they use the
    # conda-forge MSVC toolchain, not CMake's system-VS discovery.)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install cibuildwheel==${{ env.CIBW_VERSION }} uv
      - name: Install HDF5
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          & $vcpkg install hdf5:x64-windows --no-print-usage
          $hdf5root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "HDF5_ROOT=$hdf5root" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$hdf5root" >> $env:GITHUB_ENV
          echo "PATH=$hdf5root\bin;$env:PATH" >> $env:GITHUB_ENV
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: ${{ needs.setup.outputs.cibw_build }}
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_* cp314-* cp314t-* cp313t-*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BUILD_FRONTEND: "build[uv]"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-wheels-windows-latest
          path: ./wheelhouse/*.whl

  # ── Pip tests: one job per platform×python-version ────────────────────────

  test_pip_lnx:
    name: Pip Test lnx py${{ matrix.python }}
    needs: [setup, build_pip_lnx, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pip-wheels-ubuntu-latest
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and Test
        shell: bash
        env:
          TTTRLIB_DATA: ./tttr-data
        run: |
          python -m pip install --upgrade pip
          PY_VER="${{ matrix.python }}"
          PY_VER_SHORT="${PY_VER/./}"
          python -m pip install wheelhouse/*cp${PY_VER_SHORT}*.whl
          python -m pip install pytest scipy click click-didyoumean tqdm matplotlib scikit-image
          python -m pytest -v --tb=short

  test_pip_osx:
    name: Pip Test osx py${{ matrix.python }}
    needs: [setup, build_pip_osx_arm64, build_pip_osx_x86_64, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: pip-wheels-macos-*
          path: wheelhouse
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and Test
        shell: bash
        env:
          TTTRLIB_DATA: ./tttr-data
        run: |
          python -m pip install --upgrade pip
          PY_VER="${{ matrix.python }}"
          PY_VER_SHORT="${PY_VER/./}"
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            python -m pip install wheelhouse/*cp${PY_VER_SHORT}*arm64*.whl
          else
            python -m pip install wheelhouse/*cp${PY_VER_SHORT}*x86_64*.whl
          fi
          python -m pip install pytest scipy click click-didyoumean tqdm matplotlib scikit-image
          python -m pytest

  test_pip_win:
    name: Pip Test win py${{ matrix.python }}
    needs: [setup, build_pip_win, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pip-wheels-windows-latest
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          cd D:\a\tttrlib\tttrlib
          python -m pip install --upgrade pip
          for %%i in (wheelhouse\*.whl) do python -m pip install "%%i"
          python -m pip install pytest scipy click click-didyoumean tqdm matplotlib scikit-image
        shell: cmd
      - name: Test
        run: |
          cd D:\a\tttrlib\tttrlib
          python run_pytest_windows.py -v --tb=short --exitcode-file=pytest_exitcode.txt
          set /p PYTEST_EXIT=<pytest_exitcode.txt
          echo Pytest exited with: %PYTEST_EXIT%
          exit %PYTEST_EXIT%
        shell: cmd
        env:
          TTTRLIB_DATA: D:\a\tttrlib\tttrlib\tttr-data

  # ── Conda builds ──────────────────────────────────────────────────────────

  build_conda_lnx:
    name: Conda Build lnx
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: build
          use-mamba: true
          conda-remove-defaults: true
      - name: Install rattler-build
        shell: bash -l {0}
        run: conda install -y rattler-build -c conda-forge
      - name: Build Conda packages
        shell: bash -l {0}
        run: |
          export PKG_VERSION=$(python -c "import re; v=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(v.group(1))")
          for VER in ${{ needs.setup.outputs.py_versions }}; do
            rattler-build build --recipe recipes/py \
              --variant "python=$VER" \
              --output-dir ./conda-bld \
              -c conda-forge
          done
      - name: Build R Conda package (rattler)
        shell: bash -l {0}
        run: |
          export PKG_VERSION=$(python -c "import re; v=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(v.group(1))")
          rattler-build build --recipe recipes/r \
            --output-dir ./conda-bld \
            -c conda-forge
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages-ubuntu-latest
          path: ./conda-bld

  build_conda_osx:
    name: Conda Build osx
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: build
          use-mamba: true
          conda-remove-defaults: true
      - name: Install rattler-build
        shell: bash -l {0}
        run: conda install -y rattler-build -c conda-forge
      - name: Build Conda packages
        shell: bash -l {0}
        run: |
          export PKG_VERSION=$(python -c "import re; v=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(v.group(1))")
          for VER in ${{ needs.setup.outputs.py_versions }}; do
            rattler-build build --recipe recipes/py \
              --variant "python=$VER" \
              --output-dir ./conda-bld \
              -c conda-forge
          done
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages-macos-latest
          path: ./conda-bld

  build_conda_win:
    name: Conda Build win
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: build
          use-mamba: true
          conda-remove-defaults: true
      - name: Install rattler-build
        shell: bash -l {0}
        run: conda install -y rattler-build -c conda-forge
      - name: Build Conda packages
        shell: bash -l {0}
        run: |
          export PKG_VERSION=$(python -c "import re; v=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(v.group(1))")
          for VER in ${{ needs.setup.outputs.py_versions }}; do
            rattler-build build --recipe recipes/py \
              --variant "python=$VER" \
              --variant "c_compiler=vs2022" \
              --variant "cxx_compiler=vs2022" \
              --output-dir ./conda-bld \
              -c conda-forge
          done
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages-windows-latest
          path: ./conda-bld

  # ── Documentation build via rattler (recipes/docs) ───────────────────────
  # Builds the Sphinx+Doxygen HTML through the rattler recipe and uploads the
  # resulting conda package. The gh-pages deploy is handled by build_docs.

  build_conda_docs:
    name: Docs Build (rattler)
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: build
          use-mamba: true
          conda-remove-defaults: true
      - name: Install rattler-build
        shell: bash -l {0}
        run: conda install -y rattler-build -c conda-forge
      - name: Build documentation package (rattler)
        shell: bash -l {0}
        run: |
          export PKG_VERSION=$(python -c "import re; v=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(v.group(1))")
          rattler-build build --recipe recipes/docs \
            --output-dir ./conda-bld \
            -c conda-forge
      # PRD-003 M1: extract the built HTML from the docs package (install it into a
      # throwaway prefix, then copy) so the gh-pages deploy job can consume the
      # rattler-built docs instead of re-running Sphinx.
      - name: Extract built HTML
        shell: bash -l {0}
        run: |
          mamba create -y -p ./docsenv -c ./conda-bld -c conda-forge tttrlib-docs
          mkdir -p docs-html
          cp -r ./docsenv/share/doc/tttrlib/html/. docs-html/
          ls docs-html | head
      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs-html
      - uses: actions/upload-artifact@v4
        with:
          name: conda-docs-package
          path: ./conda-bld

  # ── Conda tests: one job per platform×python-version ─────────────────────

  test_conda_lnx:
    name: Conda Test lnx py${{ matrix.python }}
    needs: [setup, build_conda_lnx, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: conda-packages-ubuntu-latest
          path: conda-bld
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: test
          python-version: ${{ matrix.python }}
          use-mamba: true
          conda-remove-defaults: true
      - name: Install and Test
        shell: bash -l {0}
        env:
          TTTRLIB_DATA: ./tttr-data
        run: |
          conda install -y -c ./conda-bld/ -c conda-forge "python=${{ matrix.python }}" tttrlib pytest scipy
          python -m pytest

  test_conda_osx:
    name: Conda Test osx py${{ matrix.python }}
    needs: [setup, build_conda_osx, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: conda-packages-macos-latest
          path: conda-bld
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: test
          python-version: ${{ matrix.python }}
          use-mamba: true
          conda-remove-defaults: true
      - name: Install and Test
        shell: bash -l {0}
        env:
          TTTRLIB_DATA: ./tttr-data
        run: |
          conda install -y -c ./conda-bld/ -c conda-forge "python=${{ matrix.python }}" tttrlib pytest scipy
          python -m pytest

  test_conda_win:
    name: Conda Test win py${{ matrix.python }}
    needs: [setup, build_conda_win, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: conda-packages-windows-latest
          path: conda-bld
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          use-mamba: true
          conda-remove-defaults: true
      - name: Create test environment and install
        run: |
          call conda create -n test python=%PYTHON_VERSION% -y -c conda-forge
          call conda install -n test -y -c D:\a\tttrlib\tttrlib\conda-bld -c conda-forge python=%PYTHON_VERSION% tttrlib pytest scipy
        shell: cmd
        env:
          PYTHON_VERSION: ${{ matrix.python }}
      - name: Run tests
        run: |
          call conda activate test
          python run_pytest_windows.py -v --tb=short --exitcode-file=pytest_exitcode.txt
          set /p PYTEST_EXIT=<pytest_exitcode.txt
          echo Pytest exited with: %PYTEST_EXIT%
          exit %PYTEST_EXIT%
        shell: cmd
        env:
          TTTRLIB_DATA: D:\a\tttrlib\tttrlib\tttr-data

  # ── Bioconda build test (linux only, development branch) ─────────────────────
  # Clones the OFFICIAL bioconda-recipes, then patches only the version, source
  # url, and sha256 so the current development commit is built. Everything else
  # (build.sh, deps, test commands) stays exactly as upstream bioconda has it.
  # This catches breakage against the real recipe before a bioconda PR is filed.

  test_bioconda:
    name: Bioconda Build Test (lnx)
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: bioconda
          use-mamba: true
          conda-remove-defaults: true
          channels: conda-forge,bioconda
      - name: Install bioconda-utils
        shell: bash -l {0}
        run: mamba install -y -c conda-forge -c bioconda bioconda-utils
      - name: Clone official bioconda-recipes
        shell: bash -l {0}
        run: git clone --depth=1 https://github.com/bioconda/bioconda-recipes.git
      - name: Patch recipe for current commit
        shell: bash -l {0}
        run: |
          COMMIT=${{ github.sha }}
          RECIPE=bioconda-recipes/recipes/tttrlib/meta.yaml
          TARBALL_URL="https://github.com/Fluorescence-Tools/tttrlib/archive/${COMMIT}.tar.gz"
          
          if [ "$ACT" = "true" ]; then
            echo "Running in act: packaging local workspace"
            mkdir -p bioconda-recipes/recipes/tttrlib/src_clean
            tar --exclude='./.git' --exclude='./bioconda-recipes' --exclude='./tttr-data' --exclude='./build' --exclude='./build-dir' --exclude='./cmake-build-debug' --exclude='./cmake-build-release' --exclude='./test/data' --exclude='./doc' --exclude='./test.ptu' --exclude='./.cache' --exclude='./.idea' --exclude='./.kilocode' --exclude='./.ruff_cache' --exclude='./wheelhouse' -cf - . | tar -C bioconda-recipes/recipes/tttrlib/src_clean -xf -
            SHA256=""
          else
            curl -sL "$TARBALL_URL" -o /tmp/tttrlib-src.tar.gz
            SHA256=$(sha256sum /tmp/tttrlib-src.tar.gz | cut -d' ' -f1)
            rm /tmp/tttrlib-src.tar.gz
          fi

          python3 -c "import sys, re; recipe, act, url, sha = sys.argv[1:5]; c = open(recipe).read(); c = re.sub(r'{% set version = .* %}', '{% set version = \"0.0.0\" %}', c); c = re.sub(r'source:\s+url:\s*[^\n]+\s+sha256:\s*[^\n]+', 'source:\n  path: src_clean', c) if act == 'true' else re.sub(r'sha256: .*', f'sha256: {sha}', re.sub(r'url: .*', f'url: {url}', c)); open(recipe, 'w').write(c)" "$RECIPE" "$ACT" "$TARBALL_URL" "$SHA256"

          echo "--- Patched meta.yaml ---"
          cat "$RECIPE"
      - name: Build and test with bioconda-utils
        shell: bash -l {0}
        run: |
          cd bioconda-recipes
          # bioconda-utils installed from conda can report its version as
          # 0.0.0, which makes its default docker base image tag
          # (quay.io/bioconda/bioconda-utils-build-env-cos7:0.0.0) point at a
          # nonexistent image. Pin the base image to :latest explicitly.
          EXTRA_ARGS="--docker-base-image quay.io/bioconda/bioconda-utils-build-env-cos7:latest"
          bioconda-utils build --docker --mulled-test $EXTRA_ARGS --packages tttrlib

  # ── Docs: after all tests pass ────────────────────────────────────────────

  build_docs:
    name: Build Documentation
    needs: [test_pip_lnx, test_pip_osx, test_pip_win, test_conda_lnx, test_conda_osx, test_conda_win]
    if: |
      always() &&
      (
        github.event_name == 'release' ||
        (
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development') &&
          needs.test_pip_lnx.result == 'success' &&
          needs.test_conda_lnx.result == 'success' &&
          needs.test_pip_osx.result == 'success' &&
          needs.test_pip_win.result == 'success' &&
          needs.test_conda_osx.result == 'success' &&
          needs.test_conda_win.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    env:
      TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
      BUILD_TIER: 4
      TTTRLIB_DOCS_EXECUTE_EXAMPLES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev swig cmake pandoc doxygen graphviz
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core numpy swig
          python -m pip install sphinx sphinx-copybutton sphinx-design sphinxext-opengraph numpydoc nbsphinx matplotlib ipython sphinxcontrib-bibtex sphinx-gallery pydata-sphinx-theme scikit-image phconvert numba imagecodecs
          python -m pip install .[examples]
      - name: Cache documentation test data
        id: docs-data-cache
        uses: actions/cache@v4
        with:
          path: ./tttr-data
          key: tttr-doc-data-${{ hashFiles('test/settings.json') }}
      - name: Download documentation test data
        if: steps.docs-data-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pooch tqdm
          python test/download_test_data.py --output-dir ./tttr-data --quiet
      - name: Set documentation version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "DOCS_VERSION=${VERSION}" >> "$GITHUB_ENV"
            echo "DOCS_LABEL=tttrlib ${VERSION}" >> "$GITHUB_ENV"
            echo "DOCS_IS_STABLE=true" >> "$GITHUB_ENV"
            echo "DOCS_DEPLOY_STABLE=true" >> "$GITHUB_ENV"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "DOCS_VERSION=stable" >> "$GITHUB_ENV"
            echo "DOCS_LABEL=stable" >> "$GITHUB_ENV"
            echo "DOCS_IS_STABLE=true" >> "$GITHUB_ENV"
            echo "DOCS_DEPLOY_STABLE=true" >> "$GITHUB_ENV"
          else
            echo "DOCS_VERSION=dev" >> "$GITHUB_ENV"
            echo "DOCS_LABEL=development" >> "$GITHUB_ENV"
            echo "DOCS_IS_STABLE=false" >> "$GITHUB_ENV"
            echo "DOCS_DEPLOY_STABLE=false" >> "$GITHUB_ENV"
          fi
      - name: Build Documentation
        run: |
          cd doc
          mkdir -p _build/api
          doxygen
          BUILD_TIER=4 sphinx-build -v -b html -T -d _build/doctrees . _build/html/stable 2>&1 | tee sphinx_build.log
          python ../tools/check_docs_pages.py _build/html/stable
          python ../tools/check_docs_coverage.py api-coverage.yml . _build/html/stable
          ls -la _build/html/stable/
          ls -la _build/html/stable/auto_examples 2>/dev/null || echo "No auto_examples directory"
          rm -rf _build/html/stable/api
          cp -r _build/api _build/html/stable/
      - name: Prepare documentation version selector
        shell: bash
        run: |
          mkdir -p doc/_build/pages-root
          cp -r doc/static_root/. doc/_build/pages-root/
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show origin/gh-pages:versions.json > /tmp/tttrlib-versions.json 2>/dev/null; then
            EXISTING=/tmp/tttrlib-versions.json
          else
            EXISTING=
          fi
          STABLE_FLAG=
          if [ "$DOCS_IS_STABLE" = "true" ]; then
            STABLE_FLAG=--stable
          fi
          VERSION_ARGS=()
          if [ -n "$EXISTING" ]; then
            VERSION_ARGS+=(--existing "$EXISTING")
          fi
          if [ -n "$STABLE_FLAG" ]; then
            VERSION_ARGS+=("$STABLE_FLAG")
          fi
          python tools/update_docs_versions.py \
            "${VERSION_ARGS[@]}" \
            --output doc/_build/pages-root/versions.json \
            --version "$DOCS_VERSION" \
            --label "$DOCS_LABEL" \
            --url "$DOCS_VERSION/index.html"
      - uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: doc/_build/html/stable
      - name: Deploy release documentation version
        if: github.event_name == 'release'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html/stable
          keep_files: true
          destination_dir: ${{ env.DOCS_VERSION }}
      - name: Deploy stable documentation
        if: env.DOCS_DEPLOY_STABLE == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html/stable
          keep_files: true
          destination_dir: stable
      - name: Deploy development documentation
        if: github.ref == 'refs/heads/development'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html/stable
          keep_files: true
          destination_dir: dev
      - name: Deploy documentation version selector
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/pages-root
          keep_files: true
          destination_dir: .

  # ── Publish to PyPI ─────────────────────────────────────────────────────────
  # Downloads pre-built cibuildwheel artifacts from all platforms, builds an
  # sdist, and publishes everything to PyPI.

  publish_pypi:
    name: Publish to PyPI
    needs: [build_pip_lnx, build_pip_osx_arm64, build_pip_osx_x86_64, build_pip_win,
            test_pip_lnx, test_pip_osx, test_pip_win]
    if: >
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pip-wheels-*
          path: dist
          merge-multiple: true
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - name: List packages
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ── Publish to Conda (Windows only — Linux/macOS via bioconda) ──────────────
  # Downloads pre-built Windows conda packages and uploads to anaconda.org/tpeulen.
  # Linux and macOS conda packages are published through bioconda.

  publish_conda:
    name: Publish to Conda (Windows)
    needs: [build_conda_win, test_conda_win]
    if: >
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download conda packages (Windows)
        uses: actions/download-artifact@v4
        with:
          name: conda-packages-windows-latest
          path: conda-bld
      - name: List packages
        run: find conda-bld -name '*.conda' -o -name '*.tar.bz2' | sort
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: upload
          use-mamba: true
          conda-remove-defaults: true
      - name: Upload to Conda
        shell: bash -l {0}
        run: |
          conda install -y anaconda-client -c conda-forge
          anaconda --token ${{ secrets.ANACONDA_TOKEN }} upload \
            --user tpeulen \
            --label main \
            --force \
            conda-bld/*/tttrlib-*.conda
