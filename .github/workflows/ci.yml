name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
  # Nightly, for the checks that are too expensive to sit on every push but too
  # useful to see for the first time at release. Currently just the bioconda
  # gate, which builds against a recipe this repository does not own.
  schedule:
    - cron: '0 4 * * *'

# One run per branch. Without this every push queues a fresh copy of ~58 jobs
# behind the last: four runs of this workflow sat queued simultaneously on
# 2026-08-11, and the newest -- the only one whose answer anyone wanted --
# started last, so a fix waited half an hour on results nobody would read.
# Superseding a branch's run now cancels it instead of racing it.
#
# main and tags are exempt: a release build has to finish even if another push
# lands while it runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  DEFAULT_PYTHON: "3.10"
  CIBW_VERSION: "2.23.3"
  # The full set, for main / tags / releases.
  MAIN_PY_VERSIONS: "3.9 3.10 3.11 3.12 3.13"
  # dev's set: oldest and newest. The interpreters in between do not disagree
  # with both of these about anything this library does -- ABI changes and
  # deprecations show up at the ends. main still runs all five, so nothing
  # merges without having been seen on the full matrix.
  DEV_PY_VERSIONS: "3.9 3.13"

jobs:
  setup:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      is_main: ${{ steps.check.outputs.is_main }}
      is_dev: ${{ steps.check.outputs.is_dev }}
      py_matrix: ${{ steps.check.outputs.py_matrix }}
      src_matrix: ${{ steps.check.outputs.src_matrix }}
      has_src: ${{ steps.check.outputs.has_src }}
      lane: ${{ steps.check.outputs.lane }}
    steps:
      - id: check
        run: |
          BRANCH="${{ github.ref }}"
          # `is_main` gates the packaging path: build each artifact in its own
          # job, in its own clean tree, then install and test that artifact --
          # so what gets tested is what gets shipped. That isolation is worth
          # its cost when something is about to be published, and only then.
          # dev builds from source and tests in the same job instead: same
          # platforms, same suite, none of the artifact round-trip.
          #
          # The nightly exists for the bioconda gate alone, and it fires on the
          # default branch -- which would otherwise read as main here and queue
          # the whole packaging path every night for one job's worth of signal.
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            IS_MAIN=false; VERSIONS="${{ env.DEFAULT_PYTHON }}"
            SRC_OSES=""; LANE=standard
          elif [[ "$BRANCH" == "refs/heads/main" || "$BRANCH" == refs/tags/* ]]; then
            IS_MAIN=true;  VERSIONS="${{ env.MAIN_PY_VERSIONS }}"
            SRC_OSES=""; LANE=full
          elif [[ "$BRANCH" == "refs/heads/dev" ]]; then
            IS_MAIN=false; VERSIONS="${{ env.DEV_PY_VERSIONS }}"
            SRC_OSES="ubuntu-latest macos-latest windows-latest"; LANE=full
          else
            IS_MAIN=false; VERSIONS="${{ env.DEFAULT_PYTHON }}"
            SRC_OSES="ubuntu-latest"; LANE=fast
          fi
          echo "is_main=$IS_MAIN" >> $GITHUB_OUTPUT
          # dev keeps the packaging jobs that are cheap to keep honest --
          # the Windows wheel, the ImageJ natives and the docs -- without
          # taking the whole packaging path back.
          [ "$BRANCH" = "refs/heads/dev" ] && [ "${{ github.event_name }}" != "schedule" ] \
            && echo "is_dev=true" >> $GITHUB_OUTPUT || echo "is_dev=false" >> $GITHUB_OUTPUT
          echo "lane=$LANE" >> $GITHUB_OUTPUT
          # A matrix with an empty `include` is an error, not zero jobs, so the
          # source job is gated on this rather than on the matrix being empty.
          [ -n "$SRC_OSES" ] && echo "has_src=true" >> $GITHUB_OUTPUT || echo "has_src=false" >> $GITHUB_OUTPUT
          # `include`-only, so each entry carries both the dotted version that
          # setup-python wants and the dotless one that cibuildwheel's
          # `cpXY-*` selector wants. A job that needs neither can still read
          # `matrix.python`.
          python - "$VERSIONS" "$SRC_OSES" >> $GITHUB_OUTPUT <<'EOF'
          import json, sys
          versions = sys.argv[1].split()
          oses = sys.argv[2].split()
          print('py_matrix=' + json.dumps(
              {'include': [{'python': v, 'nodot': v.replace('.', '')} for v in versions]}))
          # Exactly one entry writes the conformance report; the file is a
          # property of the code, not of the platform that ran it.
          src = [{'os': o, 'python': v} for o in oses for v in versions]
          if src:
              src[0]['conformance'] = 'yes'
          print('src_matrix=' + json.dumps({'include': src}))
          EOF

  # ── prototype/ is a dev-branch scratch area and must not reach main ───────
  #
  # Runs on pull requests into main so the merge is blocked rather than
  # discovered afterwards, and on main itself as a backstop. Nothing under
  # prototype/ is built, packaged, or API-stable: it is where a numpy oracle or
  # a half-ported algorithm lives until it becomes a module or is deleted.

  no_prototype_on_main:
    name: prototype/ stays on dev
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a prototype/ directory
        run: |
          files=$(git ls-files prototype | head -20)
          if [ -n "$files" ]; then
            echo "::error::prototype/ is tracked on a branch that must not carry it."
            echo "$files"
            echo
            echo "prototype/ is dev-only (AGENTS.md). Before this reaches main:"
            echo "  - promote what has earned it into modules/ or examples/, and"
            echo "  - delete the rest."
            exit 1
          fi
          echo "no prototype/ directory - ok"

  # ── Multi-language SWIG generation guard (Python + R + Java) ──────────────

  swig_multilang:
    name: SWIG multi-language check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y swig
      - name: Generate Python, R and Java wrappers
        run: ./tools/check_swig_multilang.sh

  # ── Build & test the R interface (FindR.cmake + rarrays.i marshalling) ────

  build_test_r_lnx:
    name: Build & test R interface (lnx)
    needs: swig_multilang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin R to a version compatible with the SWIG release on the runner.
      # SWIG's R runtime lags new R internals (e.g. R 4.6 made CHARACTER_POINTER
      # read-only and changed S4 macros), so avoid bleeding-edge "release".
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev cmake ninja-build
          # apt has SWIG 4.2, and ext/CMakeLists.txt withholds -DSWIGWORDSIZE64
          # from the R module below SWIG 4.4. Without it SWIG resolves uint64_t
          # to 'unsigned long long' while the compiler says 'unsigned long', and
          # a std::vector<uint64_t> return (PtoFile::find_all) generates a cast
          # between two unrelated vector types. The PyPI wheel carries 4.4.
          sudo pip3 install --break-system-packages "swig~=4.4"
      - name: Configure and build R module
        run: |
          cmake -S . -B build/r -G Ninja \
            -DBUILD_PYTHON_INTERFACE=OFF \
            -DBUILD_R_INTERFACE=ON \
            -DBUILD_LIBRARY=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/r --target tttrlibR
      - name: Install R packages
        # jsonlite reads the conformance case list. It is the only new R
        # dependency the suite needs; hand-rolling a JSON parser in R is worse.
        run: Rscript -e 'install.packages("jsonlite", repos="https://cloud.r-project.org")'
      # Retries and -f, because this is a plain web server and a blip fails the
      # job: `Build & test R interface` died here on a run where the host was
      # answering fine a minute later. -f matters as much as the retries -- without
      # it curl writes the HTTP error body into the data file and the job fails
      # later, somewhere else, on a file that is not what it claims to be.
      - name: Download reference test data
        run: |
          mkdir -p tttr-data/bh tttr-data/imaging/pq/ht3 tttr-data/pq/ptu
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/bh/bh_spc132.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc132.spc
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/bh/bh_spc630_256.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc630_256.spc
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3 \
            https://www.peulen.xyz/downloads/tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/pq/ptu/pq_ptu_hh_t3.ptu \
            https://www.peulen.xyz/downloads/tttr-data/pq/ptu/pq_ptu_hh_t3.ptu
      - name: Run R tests
        env:
          TTTRLIB_R_SO: ${{ github.workspace }}/build/r/ext/tttrlib.so
          TTTRLIB_R_WRAPPER: ${{ github.workspace }}/build/r/ext/tttrlib.R
          TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
        run: |
          Rscript test/r/test_clsm.R
          Rscript test/r/test_decayfit.R
          Rscript test/r/test_pda.R
      # The conformance suite: the same case list the Python, Java and
      # JavaScript runners execute. A failure is an R binding bug, never a stale
      # constant -- see test/conformance/README.md.
      - name: Run the conformance suite
        env:
          TTTRLIB_R_SO: ${{ github.workspace }}/build/r/ext/tttrlib.so
          TTTRLIB_R_WRAPPER: ${{ github.workspace }}/build/r/ext/tttrlib.R
          TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
          TTTRLIB_CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-r.json
        run: Rscript test/r/conformance.R
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-r
          path: conformance-r.json

  # ── Build & test the Java interface (FindJNI + jarrays.i + JNI) ───────────

  build_test_java_lnx:
    name: Build & test Java interface (lnx)
    needs: swig_multilang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev swig cmake ninja-build
      - name: Configure and build JNI module
        run: |
          cmake -S . -B build/java -G Ninja \
            -DBUILD_PYTHON_INTERFACE=OFF \
            -DBUILD_JAVA_INTERFACE=ON \
            -DBUILD_LIBRARY=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/java --target tttrlibJava
      # The binding tests are JUnit 5 and live in the tttrlib Maven module
      # (ext/java/pkg). Stage the CMake-generated proxies and the JNI native into
      # its source roots, exactly as the ImageJ module does.
      - name: Stage SWIG proxies and JNI native into the Maven source tree
        run: |
          DST=ext/java/pkg/src/main/java/io/github/fluorescencetools/tttrlib
          cp build/java/java-pkg/src/main/java/io/github/fluorescencetools/tttrlib/*.java "$DST/"
          mkdir -p ext/java/pkg/src/main/resources/native/linux-x86-64
          cp build/java/java-pkg/native/libtttrlibjni.so \
             ext/java/pkg/src/main/resources/native/linux-x86-64/
      # The four files the conformance cases name. A missing one skips its cases
      # with a reason rather than failing, so a silent gap is easy to acquire --
      # keep this list in step with `data:` in test/conformance/cases/*.json.
      # One case is knowingly not covered here: stream.the_whole_set_sidecar_not
      # _five_tags needs bh/bh_spcqc004.set, which is not on the mirror. The
      # sidecar parser itself IS exercised in CI, by a case that writes its own
      # .set (stream.the_set_sidecar_parses_into_sections).
      - name: Download reference test data
        run: |
          mkdir -p tttr-data/bh tttr-data/imaging/pq/ht3 tttr-data/pq/ptu
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/bh/bh_spc132.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc132.spc
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/bh/bh_spc630_256.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc630_256.spc
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3 \
            https://www.peulen.xyz/downloads/tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/pq/ptu/pq_ptu_hh_t3.ptu \
            https://www.peulen.xyz/downloads/tttr-data/pq/ptu/pq_ptu_hh_t3.ptu
      - name: Run Java tests (JUnit 5)
        env:
          TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
          TTTRLIB_CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-java.json
        run: mvn -B -f ext/java/pkg test
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-java
          path: conformance-java.json

  # ── Build & test the JavaScript interface (Node-API + jsarrays.i) ─────────

  build_test_js_lnx:
    name: Build & test JavaScript interface (lnx)
    needs: swig_multilang
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # package.json, not the lockfile: ext/js/pkg/package-lock.json is in
          # .gitignore, so it does not exist in a fresh checkout and setup-node
          # fails when its dependency path matches nothing.
          cache-dependency-path: ext/js/pkg/package.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev swig cmake ninja-build
      # SWIG's Node-API backend generates against node-addon-api's napi.h, which
      # is an npm package rather than a system header.
      - name: Install Node-API headers
        working-directory: ext/js/pkg
        run: npm install
      - name: Configure and build the addon
        run: |
          cmake -S . -B build/js -G Ninja \
            -DBUILD_PYTHON_INTERFACE=OFF \
            -DBUILD_JAVASCRIPT_INTERFACE=ON \
            -DBUILD_LIBRARY=ON \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/js --target tttrlibJs
      - name: Download reference test data
        run: |
          mkdir -p tttr-data/bh tttr-data/imaging/pq/ht3 tttr-data/pq/ptu
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/bh/bh_spc132.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc132.spc
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/bh/bh_spc630_256.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc630_256.spc
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3 \
            https://www.peulen.xyz/downloads/tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/pq/ptu/pq_ptu_hh_t3.ptu \
            https://www.peulen.xyz/downloads/tttr-data/pq/ptu/pq_ptu_hh_t3.ptu
      # test/js/conformance.test.mjs reads the same case list the Python, R and
      # Java runners read, so the canonical values are shared rather than copied.
      # A failure there is a binding bug, never a stale constant.
      - name: Run JavaScript tests
        env:
          TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
          TTTRLIB_CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-js.json
        run: node --test test/js/
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-js
          path: conformance-js.json
      # The reference application is the binding's only non-trivial consumer;
      # a smoke request keeps its worker/route wiring from rotting unnoticed.
      - name: Smoke-test the example web application
        env:
          TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
        run: |
          node examples/js/ptu-webapp/server.mjs &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8030/api/files >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8030/api/registry | head -c 200
          curl -sf "http://127.0.0.1:8030/api/open?path=pq/ptu/pq_ptu_hh_t3.ptu&bins=100" \
            | node -e "
                let s=''; process.stdin.on('data',d=>s+=d).on('end',()=>{
                  const r=JSON.parse(s);
                  if (!(r.nEvents > 0)) { console.error('no events:', s.slice(0,200)); process.exit(1); }
                  console.log('opened', r.nEvents, 'events');
                });"

  # ── AddressSanitizer over the JS binding ──────────────────────────────────
  #
  # Deliberately a Linux job: on macOS arm64,
  # preloading the ASAN runtime into Node hangs before any JavaScript runs, with
  # no addon loaded at all -- a platform problem, not a tttrlib one. The cases
  # that matter are the lifetime ones (a TypedArray view outliving the object
  # that owns its memory), which are use-after-free rather than exceptions and
  # so are invisible to an ordinary test run.

  asan_js_lnx:
    name: ASAN over the JavaScript binding (lnx)
    needs: build_test_js_lnx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # package.json, not the lockfile: ext/js/pkg/package-lock.json is in
          # .gitignore, so it does not exist in a fresh checkout and setup-node
          # fails when its dependency path matches nothing.
          cache-dependency-path: ext/js/pkg/package.json
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev swig cmake ninja-build
      - name: Install Node-API headers
        working-directory: ext/js/pkg
        run: npm install
      - name: Build the addon with -fsanitize=address
        run: |
          cmake -S . -B build/js-asan -G Ninja \
            -DBUILD_PYTHON_INTERFACE=OFF \
            -DBUILD_JAVASCRIPT_INTERFACE=ON \
            -DBUILD_LIBRARY=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DTTTRLIB_LTO=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address"
          cmake --build build/js-asan --target tttrlibJs
      - name: Download reference test data
        run: |
          mkdir -p tttr-data/bh tttr-data/imaging/pq/ht3 tttr-data/pq/ptu
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/bh/bh_spc132.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc132.spc
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/bh/bh_spc630_256.spc \
            https://www.peulen.xyz/downloads/tttr-data/bh/bh_spc630_256.spc
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3 \
            https://www.peulen.xyz/downloads/tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/pq/ptu/pq_ptu_hh_t3.ptu \
            https://www.peulen.xyz/downloads/tttr-data/pq/ptu/pq_ptu_hh_t3.ptu
      # LD_PRELOAD is required: node is not instrumented, so the ASAN runtime has
      # to be first in the link order or the interceptors never install.
      # detect_leaks=0 because Node leaks its own allocations at exit by design;
      # this job is looking for invalid accesses, which are ours.
      #
      # TTTRLIB_ADDON is set explicitly -- index.js otherwise picks the
      # most-recently-built build*/js-pkg/, and a job that silently tested an
      # uninstrumented addon would report a clean ASAN run that never happened.
      - name: Run the JavaScript tests under ASAN
        env:
          TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
          TTTRLIB_ADDON: ${{ github.workspace }}/build/js-asan/js-pkg/tttrlib.node
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:allocator_may_return_null=1
        run: |
          export LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          node --expose-gc --test test/js/

  # ── npm prebuilds and release ─────────────────────────────────────────────
  #
  # One prebuilt binary per platform, which is the whole point of Node-API: its
  # ABI is stable across Node majors, so there is no per-version matrix here the
  # way there is for the Python wheels.
  #
  # scripts/prebuild.mjs does the work and, crucially, rejects a build whose
  # dynamic dependencies reach outside the prebuild directory. That check has to
  # run on the machine that built the binary; by the time a user reports a
  # missing libhdf5 the package is already published.

  prebuild_js:
    name: npm prebuild (${{ matrix.triple }})
    needs: [setup, build_test_js_lnx]
    if: >-
      needs.setup.outputs.is_main == 'true' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04, not -latest: the glibc the binary is built against is
          # the OLDEST it can run on, so the prebuild is made on the oldest
          # runner image still supported rather than the newest.
          - { os: ubuntu-22.04,     triple: linux-x64 }
          - { os: ubuntu-22.04-arm, triple: linux-arm64 }
          - { os: macos-15-intel,   triple: darwin-x64 }
          - { os: macos-15,         triple: darwin-arm64 }
          - { os: windows-2022,     triple: win32-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # package.json, not the lockfile: ext/js/pkg/package-lock.json is in
          # .gitignore, so it does not exist in a fresh checkout and setup-node
          # fails when its dependency path matches nothing.
          cache-dependency-path: ext/js/pkg/package.json
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libhdf5-dev binutils
          # ubuntu-22.04's apt swig is 4.0, which has no Node-API backend
          # ("Unknown engine"); the PyPI wheel carries a current SWIG.
          sudo pip3 install "swig~=4.2.1"
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install swig ninja hdf5
      # actions/cache's `path` is evaluated from the `env` context, which holds
      # only what a workflow, job or step declared -- not the runner image's own
      # environment. VCPKG_INSTALLATION_ROOT is the latter, so
      # `${{ env.VCPKG_INSTALLATION_ROOT }}` was the empty string and the path was
      # `\installed`: the cache saved nothing and every run paid 4-5 minutes to
      # compile HDF5 again. Writing it to GITHUB_ENV first puts it where the
      # expression can see it, without hardcoding C:\vcpkg.
      - name: Resolve the vcpkg root into the env context
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT_RESOLVED=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Cache vcpkg HDF5
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT_RESOLVED }}\installed
          key: vcpkg-hdf5-core-zlib-x64-windows-${{ runner.os }}-v1
      - name: Install build dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install swig ninja -y
          # See build_pip_win: the same tree, cached under the same key.
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          # hdf5[core,zlib]: see build_pip_win for why szip is skipped.
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            & $vcpkg install hdf5[core,zlib]:x64-windows --recurse --no-print-usage
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { exit 1 }
            Write-Host "vcpkg install failed (attempt $i of $attempts); retrying in 90 s"
            Start-Sleep -Seconds 90
          }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "HDF5_ROOT=$root" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$root" >> $env:GITHUB_ENV
          echo "PATH=$root\bin;$env:PATH" >> $env:GITHUB_ENV
      - name: Install Node-API headers
        working-directory: ext/js/pkg
        run: npm install
      - name: Build, stage and verify the prebuild
        shell: bash
        run: node ext/js/pkg/scripts/prebuild.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: npm-prebuild-${{ matrix.triple }}
          path: ext/js/pkg/prebuilds/${{ matrix.triple }}/
          if-no-files-found: error

  # Merge the five prebuilds into one publishable package and prove it loads.
  # `npm pack` output is uploaded on every qualifying run, so the exact tarball
  # that would be published can be downloaded and inspected before anyone
  # publishes it.

  pack_js:
    name: Assemble the npm package
    needs: prebuild_js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-prebuild-*
          path: ext/js/pkg/prebuilds
      - name: Rename artifact directories to platform triples
        run: |
          cd ext/js/pkg/prebuilds
          for d in npm-prebuild-*; do mv "$d" "${d#npm-prebuild-}"; done
          ls -laR .
      - name: Assemble and pack
        run: node ext/js/pkg/scripts/pack.mjs --pack
      - name: Smoke-test the packed tarball on this platform
        run: |
          TARBALL=$(ls npm-package/tttrlib-*.tgz)
          mkdir -p /tmp/npm-smoke && cd /tmp/npm-smoke
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL"
          node -e "
            const t = require('tttrlib');
            const areas = Object.keys(t.registry()).length;
            if (!areas) { console.error('registry is empty'); process.exit(1); }
            console.log('installed tarball loads:', areas, 'registry areas');"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: npm-package/tttrlib-*.tgz
          if-no-files-found: error

  # Publishing is a release action and needs NPM_TOKEN in the repository secrets.
  # Same trigger as publish_pypi, so npm and PyPI carry the same version.

  publish_npm:
    name: Publish to npm
    needs: pack_js
    if: >
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: dist
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$(ls dist/tttrlib-*.tgz)" --access public

  # ── ImageJ/Fiji plugin: build per-OS JNI native, assemble & release the JAR ──

  imagej_native:
    name: ImageJ native (${{ matrix.dir }})
    needs: [setup, swig_multilang]
    if: >-
      needs.setup.outputs.is_main == 'true' ||
      needs.setup.outputs.is_dev == 'true' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  dir: linux-x86-64 }
          - { os: macos-15,       dir: darwin-x86-64 }
          - { os: macos-15,       dir: darwin-aarch64 }
          - { os: windows-2022,   dir: win32-x86-64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SWIG (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y swig cmake ninja-build
      - name: Install SWIG (macOS)
        if: runner.os == 'macOS'
        run: brew install swig ninja
      - name: Install SWIG (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install swig ninja -y
      # `-G Ninja` below names no toolchain, so CMake takes the first compiler on
      # PATH -- and on this runner that is a MinGW gcc, which is what built this
      # native until now. MinGW links libstdc++ and libwinpthread into it, and
      # the plugin ships ONE file per platform, so those become dependencies a
      # user does not have. cl is the compiler the rest of the Windows artefacts
      # use; msvc-dev-cmd puts it on PATH for Ninja to find.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Build JNI native (no HDF5 needed for PTU/HT3/SPC)
        run: |
          # STATIC modules: the plugin bundles ONE JNI library per platform, so the
          # native must be self-contained rather than dlopen'ing sibling module .so's.
          cmake -S . -B build/java -G Ninja -DBUILD_PYTHON_INTERFACE=OFF -DBUILD_JAVA_INTERFACE=ON -DBUILD_LIBRARY=OFF -DBUILD_PHOTON_HDF=OFF -DWITH_AVX=OFF -DTTTRLIB_MODULE_TYPE=STATIC -DCMAKE_BUILD_TYPE=Release
          cmake --build build/java --target tttrlibJava
        shell: bash
      # Self-contained is the whole premise of bundling one native per platform,
      # so it is checked rather than assumed. A MinGW build imports libstdc++ or
      # libwinpthread; an MSVC one imports only the system runtime, which every
      # Windows machine already has.
      - name: The native must not depend on a runtime we do not ship (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = (Get-ChildItem -Recurse -Filter tttrlibjni.dll build-java | Select-Object -First 1).FullName
          Write-Host "checking $dll"
          $deps = & dumpbin /dependents $dll
          $deps | Select-String -Pattern '\.dll' | ForEach-Object { $_.Line.Trim() }
          $bad = $deps | Select-String -Pattern 'libstdc\+\+|libwinpthread|libgcc'
          if ($bad) {
            Write-Host "::error::the JNI native links a MinGW runtime that the plugin does not ship:"
            $bad | ForEach-Object { Write-Host "  $($_.Line.Trim())" }
            exit 1
          }
          Write-Host "no MinGW runtime dependencies"
      - name: Collect native + proxies
        shell: bash
        run: |
          mkdir -p stage/native/${{ matrix.dir }}
          # Name the native exactly as NativeLoader (System.mapLibraryName) expects,
          # so the bundled file is found on every platform (macOS wants .dylib, not .jnilib).
          case "${{ matrix.dir }}" in
            linux-*)  name=libtttrlibjni.so ;;
            darwin-*) name=libtttrlibjni.dylib ;;
            win32-*)  name=tttrlibjni.dll ;;
          esac
          src=$(find build/java \( -name 'libtttrlibjni*' -o -name 'tttrlibjni.dll' \) | head -1)
          cp "$src" "stage/native/${{ matrix.dir }}/$name"
          # the SWIG-generated .java proxies are identical across platforms; upload once (from Linux)
          if [ "${{ matrix.dir }}" = "linux-x86-64" ]; then
            mkdir -p stage/proxies
            cp build/java/java-pkg/src/main/java/io/github/fluorescencetools/tttrlib/*.java stage/proxies/
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: imagej-${{ matrix.dir }}
          path: stage

  imagej_assemble:
    name: Assemble ImageJ plugin JAR (all platforms)
    needs: [setup, imagej_native]
    # dev too: the four natives are built there, and a native nothing assembles
    # is half a signal -- this is the step that stages them into the Maven tree
    # and runs the headless Command tests. One minute. The two publishing steps
    # inside are already release-gated, so dev assembles and tests and stops.
    if: >-
      needs.setup.outputs.is_main == 'true' ||
      needs.setup.outputs.is_dev == 'true' ||
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/download-artifact@v4
        with:
          pattern: imagej-*
          path: dl
          merge-multiple: true
      # The plugin is a SciJava/Fiji plugin built by Maven (pom-scijava parent).
      # The SWIG proxies and per-OS JNI natives are produced by CMake in the
      # imagej_native jobs, so stage them into the standard Maven source roots
      # before packaging; both are gitignored.
      - name: Stage SWIG proxies and JNI natives into the Maven source tree
        run: |
          DST=ext/java/imagej/src/main/java/io/github/fluorescencetools/tttrlib
          cp dl/proxies/*.java "$DST/"
          cp ext/java/pkg/src/main/java/io/github/fluorescencetools/tttrlib/NativeLoader.java "$DST/"
          mkdir -p ext/java/imagej/src/main/resources/native
          cp -r dl/native/* ext/java/imagej/src/main/resources/native/
          echo "Bundled natives:"; find ext/java/imagej/src/main/resources/native -type f
      # The plugin's JUnit tests reconstruct a reference CLSM image, so they need
      # the same data file as the swig_multilang job.
      - name: Download reference test data
        run: |
          mkdir -p tttr-data/imaging/pq/ht3
          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3 \
            https://www.peulen.xyz/downloads/tttr-data/imaging/pq/ht3/pq_ht3_clsm.ht3
      - name: Build plugin JAR (runs the headless Command tests)
        env:
          TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
        run: |
          # Version from pyproject; append short SHA for non-release builds.
          VER=$(python3 -c "import re;print(re.search(r'version\s*=\s*\"([^\"]+)\"',open('pyproject.toml').read()).group(1))")
          if [ "${{ github.event_name }}" != "release" ]; then VER="${VER}+$(git rev-parse --short HEAD)"; fi
          echo "VER=${VER}" >> "$GITHUB_ENV"
          cd ext/java/imagej
          mvn -B versions:set -DnewVersion="${VER}" -DgenerateBackupPoms=false
          mvn -B package
          cd -
          cp ext/java/imagej/target/tttrlib_ImageJ-${VER}.jar "tttrlib_imagej-${VER}.jar"
          ls -la tttrlib_imagej-*.jar
      # Downloadable from any qualifying CI run (Actions ▸ run ▸ Artifacts).
      - uses: actions/upload-artifact@v4
        with:
          name: tttrlib-imagej-plugin
          path: tttrlib_imagej-*.jar
      # On a GitHub release, also attach the JAR as a release asset.
      - name: Upload JAR to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" tttrlib_imagej-*.jar --clobber
      # ── Self-hosted Fiji update site on gh-pages ──────────────────────────
      # db.xml.gz is generated by Fiji's OWN updater rather than hand-written: its
      # per-file checksums use a Fiji-specific algorithm, and a hand-rolled file
      # yields a site Fiji reports as corrupt. That means fetching a Fiji here,
      # which is why this runs on releases only.
      #
      # The gh-pages checkout carries the existing db.xml.gz forward, so a release
      # appends a version instead of dropping the site's history. `file:` selects
      # the local uploader; the upload directory must be ABSOLUTE — a relative one
      # is resolved against Fiji.app and silently writes into the install itself.
      - name: Publish to the Fiji update site
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SITE="$PWD/gh-pages/imagej"
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          mkdir -p "$SITE"

          curl --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 20 -fsSL -o fiji.zip https://downloads.imagej.net/fiji/latest/fiji-linux64.zip
          unzip -q fiji.zip && rm fiji.zip
          cp tttrlib_imagej-*.jar Fiji.app/plugins/tttrlib_imagej.jar

          ( cd Fiji.app
            ./ImageJ-linux64 --update add-update-site tttrlib \
              "https://${GITHUB_REPOSITORY_OWNER}.github.io/tttrlib/imagej/" \
              "file:" "$SITE/"
            ./ImageJ-linux64 --update upload --update-site tttrlib \
              plugins/tttrlib_imagej.jar )

          cd gh-pages
          git add -A imagej
          git -c user.name=github-actions -c user.email=github-actions@github.com \
            commit -m "ImageJ update site: tttrlib ${VER}" || echo "nothing to commit"
          git push origin gh-pages

  # ── Source build + test, in one job (everything that is not main) ─────────
  #
  # No artifact isolation: this configures, compiles and tests in the same
  # workspace. A feature branch gets one Linux job on the standard lane; dev
  # gets every platform and the full suite. The packaging path below -- wheels
  # and conda packages built in clean per-artifact jobs, then installed and
  # tested somewhere else -- is what main and releases pay for.

  build_and_test:
    name: Build & Test ${{ matrix.os }} py${{ matrix.python }}
    needs: setup
    if: needs.setup.outputs.has_src == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.src_matrix) }}
    steps:
      # fetch-depth: 0 because setuptools_scm reads the tags (pyproject.toml,
      # `version.provider`). blob:none because the pack is 1.45 GB of test data
      # deleted long ago -- the filter keeps every commit and tag and fetches
      # blobs only for HEAD. Every full-history checkout below does the same.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      # The controlled vocabulary every `.pto` is written in lives in mmfdb, and
      # nowhere else (okf/specs/mmfdb-is-the-vocabulary.md). Checked out rather
      # than pip-installed: the tests read four `.dic` files, and installing the
      # package would pull its whole server-side dependency tree to do it.
      # MMFDB_REQUIRED turns "mmfdb is missing" from a skip into a failure --
      # a skipped conformance test reads as a pass in a CI summary, which is the
      # exact blind spot the vocabulary rule exists to close.
      - name: Check out the mmfdb vocabulary
        uses: actions/checkout@v4
        with:
          repository: Fluorescence-Tools/mmfdb
          path: .mmfdb
      # SWIG and CMake come from the build requirements in pyproject.toml, so
      # only HDF5 has to be installed by hand.
      - name: Install HDF5 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev cmake
      - name: Install HDF5 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5 || brew upgrade hdf5 || true
          echo "CMAKE_PREFIX_PATH=$(brew --prefix hdf5)" >> $GITHUB_ENV
      # Ninja here for the same reasons as the wheel: MSBuild parallelises whole
      # projects, so each of the 34 module DLLs waits for every dependency to
      # compile and link. It also decouples this job from the runner image --
      # the Visual Studio generator is what could not discover an instance on
      # windows-2025, and Ninja discovers nothing, it takes cl from PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - uses: mozilla-actions/sccache-action@v0.0.9
        if: runner.os == 'Windows'
      # actions/cache's `path` is evaluated from the `env` context, which holds
      # only what a workflow, job or step declared -- not the runner image's own
      # environment. VCPKG_INSTALLATION_ROOT is the latter, so
      # `${{ env.VCPKG_INSTALLATION_ROOT }}` was the empty string and the path was
      # `\installed`: the cache saved nothing and every run paid 4-5 minutes to
      # compile HDF5 again. Writing it to GITHUB_ENV first puts it where the
      # expression can see it, without hardcoding C:\vcpkg.
      - name: Resolve the vcpkg root into the env context
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT_RESOLVED=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Cache vcpkg HDF5
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT_RESOLVED }}\installed
          key: vcpkg-hdf5-core-zlib-x64-windows-${{ runner.os }}-v1
      - name: Install HDF5 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # See build_pip_win for why szip is skipped and why this retries.
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
            & $vcpkg install hdf5[core,zlib]:x64-windows --recurse --no-print-usage
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { exit 1 }
            Write-Host "vcpkg install failed (attempt $i of $attempts); retrying in 90 s"
            Start-Sleep -Seconds 90
          }
          $root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "HDF5_ROOT=$root" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$root" >> $env:GITHUB_ENV
          echo "PATH=$root\bin;$env:PATH" >> $env:GITHUB_ENV
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $env:GITHUB_ENV
          echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
      - name: Cache test data
        id: cache
        uses: actions/cache@v4
        with:
          path: ./tttr-data
          key: tttr-test-data-${{ hashFiles('test/settings.json') }}
      - name: Download test data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pooch tqdm
          python test/download_test_data.py --output-dir ./tttr-data --quiet
      - name: Build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" jsonschema
          python -m pip install click click-didyoumean tqdm matplotlib scikit-image
      # Windows resolves an extension's dependent DLLs from the directory the
      # .pyd sits in, not from PATH -- Python 3.8 stopped searching PATH. The
      # wheel jobs do not hit this because delvewheel bundles HDF5 into the
      # wheel; a source install leaves it in the vcpkg prefix, and every test
      # then fails at import with "DLL load failed while importing _tttrlib".
      - name: Put HDF5 beside the extension (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pkg=$(python -c "import sysconfig, os; print(os.path.join(sysconfig.get_paths()['purelib'], 'tttrlib'))")
          cp "$HDF5_ROOT"/bin/*.dll "$pkg"/
          python -c "import tttrlib; print('import ok:', tttrlib.__file__)"
      # The `heavy` tier is 85% of the runtime for statistics that a branch
      # push cannot break without also breaking something cheaper, so a feature
      # branch gets `standard`. dev runs the whole suite.
      - name: Test
        shell: bash
        env:
          TTTRLIB_DATA: ./tttr-data
          TTTRLIB_CONFORMANCE_REPORT: ${{ github.workspace }}/conformance-python.json
          MMFDB_DIC_DIR: ${{ github.workspace }}/.mmfdb/src/mmfdb/data
          MMFDB_REQUIRED: "1"
        run: python test/run_suite.py -v --tb=short --lane ${{ needs.setup.outputs.lane }}
      # always(), and the same one-entry rule test_pip_lnx uses: a suite that
      # fails still reports which cases passed, and that is the interesting
      # table. Only one of the two jobs ever runs -- this one off main, that
      # one on it -- so the artifact never has two producers in a run.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.conformance == 'yes'
        with:
          name: conformance-python
          path: conformance-python.json
          if-no-files-found: ignore

  # ── Publish the conformance coverage matrix ───────────────────────────────
  #
  # The table is an artefact, not a checked-in file to diff against: which cases
  # a runner can execute depends on which data files that job downloaded, so a
  # byte-exact committed matrix would be wrong the moment the data set changed.
  # What IS enforced, deterministically and without any of this, lives in
  # test/python/test_conformance.py -- the schema, unique ids, and every op a
  # case names existing in the vocabulary.

  conformance_matrix:
    name: Conformance coverage matrix
    # Both producers of the Python column: test_pip_lnx on main, build_and_test
    # everywhere else. Whichever did not run is skipped, and always() below
    # keeps the table publishing regardless.
    needs: [build_test_r_lnx, build_test_java_lnx, build_test_js_lnx, test_pip_lnx, build_and_test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: conformance-*
          merge-multiple: true
        continue-on-error: true
      - name: Build the matrix
        run: |
          python tools/conformance_matrix.py \
            --report python=conformance-python.json \
            --report r=conformance-r.json \
            --report java=conformance-java.json \
            --report js=conformance-js.json \
            --out doc/conformance.rst
          cat doc/conformance.rst >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-matrix
          path: doc/conformance.rst

  # ── Full builds + tests (main and dev only) ───────────────────────────────

  download_test_data:
    name: Download Test Data
    needs: setup
    # dev needs this now that it runs a packaging test job: without it
    # test_pip_win has no data and, worse, is skipped outright because a job
    # whose `needs` was skipped never runs.
    if: needs.setup.outputs.is_main == 'true' || needs.setup.outputs.is_dev == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Cache test data
        id: cache
        uses: actions/cache@v4
        with:
          path: ./tttr-data
          key: tttr-test-data-${{ hashFiles('test/settings.json') }}
      - name: Download test data
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pooch tqdm
          python test/download_test_data.py --output-dir ./tttr-data --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
          retention-days: 1

  # ── Pip builds ────────────────────────────────────────────────────────────

  # One job per interpreter, not one job building all of them. cibuildwheel
  # given five `cpXY-*` specs builds them strictly in sequence and shares
  # nothing between them -- 51 minutes on Windows for five compiles of a core
  # that only differs in which Python headers the SWIG wrapper sees.
  build_pip_lnx:
    name: Pip Build lnx py${{ matrix.python }}
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install cibuildwheel==${{ env.CIBW_VERSION }} uv
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.nodot }}-*
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_* cp314-* cp314t-* cp313t-*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BUILD_FRONTEND: "build[uv]"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-wheels-ubuntu-latest-py${{ matrix.python }}
          path: ./wheelhouse/*.whl

  build_pip_osx_arm64:
    name: Pip Build osx arm64 py${{ matrix.python }}
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install cibuildwheel==${{ env.CIBW_VERSION }} uv
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.nodot }}-*
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_* cp314-* cp314t-* cp313t-*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ARCHS_MACOS: "arm64"
          MACOSX_DEPLOYMENT_TARGET: "26.0"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-wheels-macos-arm64-py${{ matrix.python }}
          path: ./wheelhouse/*.whl

  build_pip_osx_x86_64:
    name: Pip Build osx x86_64 py${{ matrix.python }}
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install cibuildwheel==${{ env.CIBW_VERSION }} uv
      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: cp${{ matrix.nodot }}-*
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_* cp314-* cp314t-* cp313t-*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BUILD_FRONTEND: "build[uv]"
          CIBW_ARCHS_MACOS: "x86_64"
          MACOSX_DEPLOYMENT_TARGET: "26.0"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-wheels-macos-x86_64-py${{ matrix.python }}
          path: ./wheelhouse/*.whl

  build_pip_win:
    name: Pip Build win py${{ matrix.python }}
    needs: setup
    if: needs.setup.outputs.is_main == 'true' || needs.setup.outputs.is_dev == 'true'
    # windows-latest again. The pin to windows-2022 existed because the
    # "Visual Studio 17 2022" generator could not discover a VS instance on
    # windows-2025; Ninja discovers nothing -- msvc-dev-cmd puts cl on PATH and
    # Ninja takes it -- so the reason went away with the generator. Verified on
    # windows-2025 before removing it, and CMakeLists.txt fails the wheel
    # configure if the compiler is ever not MSVC, so a silent regression here
    # is not available.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - run: python -m pip install cibuildwheel==${{ env.CIBW_VERSION }} uv
      # Ninja needs cl on PATH: scikit-build-core only arranges the MSVC
      # environment for "Visual Studio" generators, so with Ninja the job has to
      # do it. cibuildwheel's build subprocesses inherit it.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # sccache, not ccache: ccache has no usable MSVC support, sccache does.
      #
      # The win here is structural. `modules/` and `cmake/` reference Python
      # nowhere, so the 34 module DLLs are byte-identical work for every
      # interpreter in the matrix -- only the SWIG wrapper differs. sccache keys
      # on the preprocessed source and the flags, so the first leg to compile a
      # module populates the cache and the rest read it, here and on the next
      # run. The GitHub Actions cache is the backend, so it survives the job.
      - uses: mozilla-actions/sccache-action@v0.0.9
      # vcpkg builds HDF5 from source -- ~4 minutes, on the critical path, and
      # dependent on mirrors that rate-limit the runners (see below). The tree
      # only changes when the package spec does, so cache it and let the
      # install step below short-circuit on a hit.
      # actions/cache's `path` is evaluated from the `env` context, which holds
      # only what a workflow, job or step declared -- not the runner image's own
      # environment. VCPKG_INSTALLATION_ROOT is the latter, so
      # `${{ env.VCPKG_INSTALLATION_ROOT }}` was the empty string and the path was
      # `\installed`: the cache saved nothing and every run paid 4-5 minutes to
      # compile HDF5 again. Writing it to GITHUB_ENV first puts it where the
      # expression can see it, without hardcoding C:\vcpkg.
      - name: Resolve the vcpkg root into the env context
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "VCPKG_ROOT_RESOLVED=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Cache vcpkg HDF5
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_ROOT_RESOLVED }}\installed
          key: vcpkg-hdf5-core-zlib-x64-windows-${{ runner.os }}-v1
      - name: Install HDF5
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"
          # hdf5[core,zlib]: skip the default szip feature. szip pulls libaec,
          # whose only source mirror (gitlab.dkrz.de) rate-limits GitHub's
          # runner IPs with HTTP 429 for minutes at a time (observed: 5
          # spaced retries over 7 min all 429) - the wheel build cannot depend
          # on it. tttrlib reads photon-HDF5 (gzip-compressed); szip-encoded
          # HDF5 stays readable via the conda packages, which ship libaec.
          # The retry loop guards the remaining downloads (hdf5/zlib mirrors).
          $attempts = 3
          for ($i = 1; $i -le $attempts; $i++) {
          & $vcpkg install hdf5[core,zlib]:x64-windows --recurse --no-print-usage
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq $attempts) { exit 1 }
            Write-Host "vcpkg install failed (attempt $i of $attempts); retrying in 90 s"
            Start-Sleep -Seconds 90
          }
          $hdf5root = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows"
          echo "HDF5_ROOT=$hdf5root" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$hdf5root" >> $env:GITHUB_ENV
          echo "PATH=$hdf5root\bin;$env:PATH" >> $env:GITHUB_ENV
      - name: Build wheels
        run: |
          python -m cibuildwheel --output-dir wheelhouse
          sccache --show-stats
        env:
          CIBW_BUILD: cp${{ matrix.nodot }}-*
          CIBW_SKIP: "pp* *-win32 *-manylinux_i686 *-musllinux_* cp314-* cp314t-* cp313t-*"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_BUILD_FRONTEND: "build[uv]"
          # SCCACHE_GHA_ENABLED and the launchers are set in pyproject.toml's
          # [tool.cibuildwheel.windows.environment]; setting CIBW_ENVIRONMENT_WINDOWS
          # here would replace that table wholesale. The sccache action's
          # ACTIONS_CACHE_URL and ACTIONS_RUNTIME_TOKEN are inherited from the job.
          SCCACHE_GHA_ENABLED: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: pip-wheels-windows-latest-py${{ matrix.python }}
          path: ./wheelhouse/*.whl

  # ── Pip tests: one job per platform×python-version ────────────────────────

  test_pip_lnx:
    name: Pip Test lnx py${{ matrix.python }}
    needs: [setup, build_pip_lnx, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the mmfdb vocabulary
        uses: actions/checkout@v4
        with:
          repository: Fluorescence-Tools/mmfdb
          path: .mmfdb
      - uses: actions/download-artifact@v4
        with:
          name: pip-wheels-ubuntu-latest-py${{ matrix.python }}
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and Test
        shell: bash
        env:
          TTTRLIB_DATA: ./tttr-data
          MMFDB_DIC_DIR: ${{ github.workspace }}/.mmfdb/src/mmfdb/data
          MMFDB_REQUIRED: "1"
          # Exactly one entry writes the conformance report, the same rule the
          # source matrix uses: the answers are a property of the code, not of
          # the platform that ran it. Empty elsewhere, and the runner writes
          # nothing when it is empty. Without this the published table has no
          # Python column at all -- the cases run here, but nothing collected
          # them, and Python is the binding the other three are compared to.
          TTTRLIB_CONFORMANCE_REPORT: ${{ matrix.python == '3.11' && format('{0}/conformance-python.json', github.workspace) || '' }}
        run: |
          python -m pip install --upgrade pip
          PY_VER="${{ matrix.python }}"
          PY_VER_SHORT="${PY_VER/./}"
          python -m pip install wheelhouse/*cp${PY_VER_SHORT}*.whl
          python -m pip install pytest scipy click click-didyoumean tqdm matplotlib scikit-image
          # Per-directory sessions: a segfault in one group must not take the
          # other groups' tracebacks down with it. See test/run_suite.py.
          python test/run_suite.py -v --tb=short
      # always(): a suite that fails still reports which cases passed, and that
      # is the interesting table -- a blank column says nothing about why.
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.11'
        with:
          name: conformance-python
          path: conformance-python.json
          if-no-files-found: ignore

  # The oldest LTS the project supports, which nothing else here exercises.
  #
  # Ubuntu 22.04 is supported until 2027 and ships glibc 2.35, so a
  # manylinux_2_28 wheel installs and runs on it -- but every other Linux test
  # job runs on 24.04, so that was an assumption rather than a fact. The wheel
  # is the thing to test: building from source on 22.04 additionally needs SWIG
  # >= 4.1 from PyPI, because apt ships 4.0 and the bindings use the newer
  # SWIG_Python_AppendOutput API (1150fb51c).
  #
  # One interpreter, not the full matrix: this checks the platform floor, and
  # the per-version surface is already covered on 24.04.
  test_pip_lnx_oldest_lts:
    name: Pip Test lnx 22.04 (oldest LTS)
    needs: [setup, build_pip_lnx, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the mmfdb vocabulary
        uses: actions/checkout@v4
        with:
          repository: Fluorescence-Tools/mmfdb
          path: .mmfdb
      - uses: actions/download-artifact@v4
        with:
          name: pip-wheels-ubuntu-latest
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Install and Test
        shell: bash
        env:
          TTTRLIB_DATA: ./tttr-data
          MMFDB_DIC_DIR: ${{ github.workspace }}/.mmfdb/src/mmfdb/data
          MMFDB_REQUIRED: "1"
        run: |
          python -m pip install --upgrade pip
          PY_VER="${{ env.DEFAULT_PYTHON }}"
          PY_VER_SHORT="${PY_VER/./}"
          python -m pip install wheelhouse/*cp${PY_VER_SHORT}*.whl
          python -c "import tttrlib, platform; print('glibc', platform.libc_ver()); print('tttrlib', tttrlib.__file__)"
          python -m pip install pytest scipy click click-didyoumean tqdm matplotlib scikit-image
          python test/run_suite.py -v --tb=short

  test_pip_osx:
    name: Pip Test osx py${{ matrix.python }}
    needs: [setup, build_pip_osx_arm64, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      # The vocabulary is the mmfdb repository, never a copy kept here, so the
      # tests that check this library against it read the dictionaries pulled
      # from that repo at run time. Without this they skipped on osx and win.
      - name: Check out the mmfdb vocabulary
        uses: actions/checkout@v4
        with:
          repository: Fluorescence-Tools/mmfdb
          path: .mmfdb
      - uses: actions/download-artifact@v4
        with:
          name: pip-wheels-macos-arm64-py${{ matrix.python }}
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install and Test
        shell: bash
        env:
          TTTRLIB_DATA: ./tttr-data
          MMFDB_DIC_DIR: ${{ github.workspace }}/.mmfdb/src/mmfdb/data
          MMFDB_REQUIRED: "1"
        run: |
          python -m pip install --upgrade pip
          # arm64 unconditionally: this job runs on macos-26, where `uname -m`
          # is always arm64. The x86_64 branch that used to sit here could not
          # execute, and the dependency on the x86_64 build it implied held
          # every one of these test jobs behind a 49-minute build they never
          # installed from. That wheel is still built, and still published.
          python -m pip install wheelhouse/*cp${{ matrix.nodot }}*arm64*.whl
          python -m pip install pytest scipy click click-didyoumean tqdm matplotlib scikit-image
          # See the linux job: one group's crash must not hide the others.
          python test/run_suite.py -v --tb=short

  test_pip_win:
    name: Pip Test win py${{ matrix.python }}
    needs: [setup, build_pip_win, download_test_data]
    # dev too: dev builds the Windows wheel, and a wheel that is built and never
    # installed says nothing about whether it loads. The source build beside it
    # covers the code; this covers the artefact -- that delvewheel bundled HDF5,
    # that the module DLLs resolve, that the thing imports on a clean machine.
    if: needs.setup.outputs.is_main == 'true' || needs.setup.outputs.is_dev == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      # The vocabulary is the mmfdb repository, never a copy kept here, so the
      # tests that check this library against it read the dictionaries pulled
      # from that repo at run time. Without this they skipped on osx and win.
      - name: Check out the mmfdb vocabulary
        uses: actions/checkout@v4
        with:
          repository: Fluorescence-Tools/mmfdb
          path: .mmfdb
      - uses: actions/download-artifact@v4
        with:
          name: pip-wheels-windows-latest-py${{ matrix.python }}
          path: wheelhouse
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          cd D:\a\tttrlib\tttrlib
          python -m pip install --upgrade pip
          for %%i in (wheelhouse\*.whl) do python -m pip install "%%i"
          python -m pip install pytest pytest-reportlog scipy click click-didyoumean tqdm matplotlib scikit-image
        shell: cmd
      - name: Test
        run: |
          cd D:\a\tttrlib\tttrlib
          REM Per-directory sessions: a segfault in one group must not take the
          REM other groups' tracebacks down with it. See test/run_suite.py.
          python test/run_suite.py -v --tb=short
        shell: cmd
        env:
          TTTRLIB_DATA: D:\a\tttrlib\tttrlib\tttr-data
          MMFDB_DIC_DIR: ${{ github.workspace }}\.mmfdb\src\mmfdb\data
          MMFDB_REQUIRED: "1"

  # ── Conda builds ──────────────────────────────────────────────────────────

  # Same reasoning as the pip builds: a `for VER in ...` loop inside one job is
  # five sequential compiles. The 180-minute timeouts on these three jobs were
  # sized for that loop.
  build_conda_lnx:
    name: Conda Build lnx py${{ matrix.python }}
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: build
          use-mamba: true
          conda-remove-defaults: true
      - name: Install rattler-build
        shell: bash -l {0}
        run: conda install -y rattler-build -c conda-forge
      - name: Build Conda packages
        shell: bash -l {0}
        run: |
          export PKG_VERSION=$(python -c "import re; v=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(v.group(1))")
          rattler-build build --recipe recipes/py \
            --variant "python=${{ matrix.python }}" \
            --output-dir ./conda-bld \
            -c conda-forge
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages-ubuntu-latest-py${{ matrix.python }}
          path: ./conda-bld

  # The R package does not vary with the Python version, so it does not belong
  # in the matrix above -- riding along there would build it once per
  # interpreter for one artifact.
  build_conda_r_lnx:
    name: Conda Build R (lnx)
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: build
          use-mamba: true
          conda-remove-defaults: true
      - name: Install rattler-build
        shell: bash -l {0}
        run: conda install -y rattler-build -c conda-forge
      - name: Build R Conda package (rattler)
        shell: bash -l {0}
        run: |
          export PKG_VERSION=$(python -c "import re; v=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(v.group(1))")
          rattler-build build --recipe recipes/r \
            --output-dir ./conda-bld \
            -c conda-forge
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages-r-ubuntu-latest
          path: ./conda-bld

  build_conda_osx:
    name: Conda Build osx py${{ matrix.python }}
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: build
          use-mamba: true
          conda-remove-defaults: true
      - name: Install rattler-build
        shell: bash -l {0}
        run: conda install -y rattler-build -c conda-forge
      - name: Build Conda packages
        shell: bash -l {0}
        run: |
          export PKG_VERSION=$(python -c "import re; v=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(v.group(1))")
          rattler-build build --recipe recipes/py \
            --variant "python=${{ matrix.python }}" \
            --output-dir ./conda-bld \
            -c conda-forge
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages-macos-latest-py${{ matrix.python }}
          path: ./conda-bld

  build_conda_win:
    name: Conda Build win py${{ matrix.python }}
    needs: setup
    if: needs.setup.outputs.is_main == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: build
          use-mamba: true
          conda-remove-defaults: true
      - name: Install rattler-build
        shell: bash -l {0}
        run: conda install -y rattler-build -c conda-forge
      - name: Build Conda packages
        shell: bash -l {0}
        run: |
          export PKG_VERSION=$(python -c "import re; v=re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml').read()); print(v.group(1))")
          rattler-build build --recipe recipes/py \
            --variant "python=${{ matrix.python }}" \
            --variant "c_compiler=vs2022" \
            --variant "cxx_compiler=vs2022" \
            --output-dir ./conda-bld \
            -c conda-forge
      - uses: actions/upload-artifact@v4
        with:
          name: conda-packages-windows-latest-py${{ matrix.python }}
          path: ./conda-bld

  # The rattler docs job that used to sit here (`build_conda_docs`)
  # rendered the whole Sphinx+Doxygen site and uploaded it as `docs-html` --
  # which nothing ever downloaded. `build_docs` below renders the same site
  # again and is the only one that deploys. Finishing the M1 wiring instead of
  # deleting this would not have helped: `build_docs` compiles the library for
  # autodoc regardless, and that compile is what makes it expensive.

  # ── Conda tests: one job per platform×python-version ─────────────────────

  test_conda_lnx:
    name: Conda Test lnx py${{ matrix.python }}
    needs: [setup, build_conda_lnx, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the mmfdb vocabulary
        uses: actions/checkout@v4
        with:
          repository: Fluorescence-Tools/mmfdb
          path: .mmfdb
      - uses: actions/download-artifact@v4
        with:
          name: conda-packages-ubuntu-latest-py${{ matrix.python }}
          path: conda-bld
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: test
          python-version: ${{ matrix.python }}
          use-mamba: true
          conda-remove-defaults: true
      - name: Install and Test
        shell: bash -l {0}
        env:
          TTTRLIB_DATA: ./tttr-data
          MMFDB_DIC_DIR: ${{ github.workspace }}/.mmfdb/src/mmfdb/data
          MMFDB_REQUIRED: "1"
        run: |
          conda install -y -c ./conda-bld/ -c conda-forge "python=${{ matrix.python }}" tttrlib pytest scipy
          # See the pip jobs: one group's crash must not hide the others.
          python test/run_suite.py -v --tb=short

  test_conda_osx:
    name: Conda Test osx py${{ matrix.python }}
    needs: [setup, build_conda_osx, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      # The vocabulary is the mmfdb repository, never a copy kept here, so the
      # tests that check this library against it read the dictionaries pulled
      # from that repo at run time. Without this they skipped on osx and win.
      - name: Check out the mmfdb vocabulary
        uses: actions/checkout@v4
        with:
          repository: Fluorescence-Tools/mmfdb
          path: .mmfdb
      - uses: actions/download-artifact@v4
        with:
          name: conda-packages-macos-latest-py${{ matrix.python }}
          path: conda-bld
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: test
          python-version: ${{ matrix.python }}
          use-mamba: true
          conda-remove-defaults: true
      - name: Install and Test
        shell: bash -l {0}
        env:
          TTTRLIB_DATA: ./tttr-data
          MMFDB_DIC_DIR: ${{ github.workspace }}/.mmfdb/src/mmfdb/data
          MMFDB_REQUIRED: "1"
        run: |
          conda install -y -c ./conda-bld/ -c conda-forge "python=${{ matrix.python }}" tttrlib pytest scipy
          # See the pip jobs: one group's crash must not hide the others.
          python test/run_suite.py -v --tb=short

  test_conda_win:
    name: Conda Test win py${{ matrix.python }}
    needs: [setup, build_conda_win, download_test_data]
    if: needs.setup.outputs.is_main == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.py_matrix) }}
    steps:
      - uses: actions/checkout@v4
      # The vocabulary is the mmfdb repository, never a copy kept here, so the
      # tests that check this library against it read the dictionaries pulled
      # from that repo at run time. Without this they skipped on osx and win.
      - name: Check out the mmfdb vocabulary
        uses: actions/checkout@v4
        with:
          repository: Fluorescence-Tools/mmfdb
          path: .mmfdb
      - uses: actions/download-artifact@v4
        with:
          name: conda-packages-windows-latest-py${{ matrix.python }}
          path: conda-bld
      - uses: actions/download-artifact@v4
        with:
          name: tttr-test-data
          path: ./tttr-data
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          use-mamba: true
          conda-remove-defaults: true
      - name: Create test environment and install
        run: |
          call conda create -n test python=%PYTHON_VERSION% -y -c conda-forge
          call conda install -n test -y -c D:\a\tttrlib\tttrlib\conda-bld -c conda-forge python=%PYTHON_VERSION% tttrlib pytest pytest-reportlog scipy
        shell: cmd
        env:
          PYTHON_VERSION: ${{ matrix.python }}
      - name: Run tests
        run: |
          call conda activate test
          REM Per-directory sessions: a segfault in one group must not take the
          REM other groups' tracebacks down with it. See test/run_suite.py.
          python test/run_suite.py -v --tb=short
        shell: cmd
        env:
          TTTRLIB_DATA: D:\a\tttrlib\tttrlib\tttr-data
          MMFDB_DIC_DIR: ${{ github.workspace }}\.mmfdb\src\mmfdb\data
          MMFDB_REQUIRED: "1"

  # ── Bioconda build test (linux only, dev branch) ─────────────────────────
  # Clones the OFFICIAL bioconda-recipes, then patches only the version, source
  # url, and sha256 so the current dev commit is built. Everything else
  # (build.sh, deps, test commands) stays exactly as upstream bioconda has it.
  # This catches breakage against the real recipe before a bioconda PR is filed.

  # Not on a dev push: this builds a recipe the repository does not own, against
  # a tarball GitHub only has once the commit is pushed, and it is the longest
  # job in the run at ~74 minutes. It gates a release, so it runs on main, on a
  # release, on demand -- and nightly, so recipe breakage on dev surfaces within
  # a day rather than at the next tag.
  test_bioconda:
    name: Bioconda Build Test (lnx)
    needs: setup
    if: >-
      github.ref == 'refs/heads/main'
      || startsWith(github.ref, 'refs/tags/')
      || github.event_name == 'release'
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: bioconda
          use-mamba: true
          conda-remove-defaults: true
          channels: conda-forge,bioconda
      - name: Install bioconda-utils
        shell: bash -l {0}
        run: mamba install -y -c conda-forge -c bioconda bioconda-utils
      - name: Clone official bioconda-recipes
        shell: bash -l {0}
        run: git clone --depth=1 https://github.com/bioconda/bioconda-recipes.git
      - name: Patch recipe for current commit
        shell: bash -l {0}
        run: |
          COMMIT=${{ github.sha }}
          RECIPE=bioconda-recipes/recipes/tttrlib/meta.yaml
          TARBALL_URL="https://github.com/Fluorescence-Tools/tttrlib/archive/${COMMIT}.tar.gz"
          
          if [ "$ACT" = "true" ]; then
            echo "Running in act: packaging local workspace"
            mkdir -p bioconda-recipes/recipes/tttrlib/src_clean
            tar --exclude='./.git' --exclude='./bioconda-recipes' --exclude='./tttr-data' --exclude='./build' --exclude='./build-dir' --exclude='./cmake-build-debug' --exclude='./cmake-build-release' --exclude='./test/data' --exclude='./doc' --exclude='./test.ptu' --exclude='./.cache' --exclude='./.idea' --exclude='./.kilocode' --exclude='./.ruff_cache' --exclude='./wheelhouse' -cf - . | tar -C bioconda-recipes/recipes/tttrlib/src_clean -xf -
            SHA256=""
          else
            curl -sL "$TARBALL_URL" -o /tmp/tttrlib-src.tar.gz
            SHA256=$(sha256sum /tmp/tttrlib-src.tar.gz | cut -d' ' -f1)
            rm /tmp/tttrlib-src.tar.gz
          fi

          python3 -c "import sys, re; recipe, act, url, sha = sys.argv[1:5]; c = open(recipe).read(); c = re.sub(r'{% set version = .* %}', '{% set version = \"0.0.0\" %}', c); c = re.sub(r'source:\s+url:\s*[^\n]+\s+sha256:\s*[^\n]+', 'source:\n  path: src_clean', c) if act == 'true' else re.sub(r'sha256: .*', f'sha256: {sha}', re.sub(r'url: .*', f'url: {url}', c)); open(recipe, 'w').write(c)" "$RECIPE" "$ACT" "$TARBALL_URL" "$SHA256"

          echo "--- Patched meta.yaml ---"
          cat "$RECIPE"
      - name: Build and test with bioconda-utils
        shell: bash -l {0}
        run: |
          cd bioconda-recipes
          # bioconda-utils installed from conda can report its version as
          # 0.0.0, which makes its default docker base image tag
          # (quay.io/bioconda/bioconda-utils-build-env-cos7:0.0.0) point at a
          # nonexistent image. Pin the base image to :latest explicitly.
          EXTRA_ARGS="--docker-base-image quay.io/bioconda/bioconda-utils-build-env-cos7:latest"
          bioconda-utils build --docker --mulled-test $EXTRA_ARGS --packages tttrlib

  # ── Docs: after all tests pass ────────────────────────────────────────────

  # main and releases only. This used to name dev as well, but it gates on the
  # packaging tests passing and those no longer run there -- a dev push would
  # have skipped this silently rather than deploying. It is also a ~20-minute
  # job that recompiles the library for autodoc, which is exactly the kind of
  # cost dev is not paying any more. To publish docs from dev again, add
  # build_and_test to `needs` and to the branch clause below.
  build_docs:
    name: Build Documentation
    needs: [test_pip_lnx, test_pip_osx, test_pip_win, test_conda_lnx, test_conda_osx, test_conda_win,
            build_and_test]
    # Two gates, because the two branches prove the code different ways: main
    # runs the packaging tests, dev runs the source build. Each waits for the one
    # it actually has -- a skipped job's result is 'skipped', never 'success', so
    # neither condition can be satisfied by absence.
    if: |
      always() &&
      (
        github.event_name == 'release' ||
        (
          github.ref == 'refs/heads/dev' &&
          needs.build_and_test.result == 'success'
        ) ||
        (
          github.ref == 'refs/heads/main' &&
          needs.test_pip_lnx.result == 'success' &&
          needs.test_conda_lnx.result == 'success' &&
          needs.test_pip_osx.result == 'success' &&
          needs.test_pip_win.result == 'success' &&
          needs.test_conda_osx.result == 'success' &&
          needs.test_conda_win.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    env:
      TTTRLIB_DATA: ${{ github.workspace }}/tttr-data
      BUILD_TIER: 4
      TTTRLIB_DOCS_EXECUTE_EXAMPLES: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev swig cmake pandoc doxygen graphviz
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache: pip
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install scikit-build-core numpy swig
          python -m pip install sphinx sphinx-copybutton sphinx-design sphinxext-opengraph numpydoc nbsphinx matplotlib ipython sphinxcontrib-bibtex sphinx-gallery pydata-sphinx-theme scikit-image phconvert numba imagecodecs
          python -m pip install .[examples]
      # Same key as build_and_test and download_test_data: this is the same ~1.5 GB
      # from the same manifest, and a separate key meant downloading and storing
      # it a second time.
      - name: Cache documentation test data
        id: docs-data-cache
        uses: actions/cache@v4
        with:
          path: ./tttr-data
          key: tttr-test-data-${{ hashFiles('test/settings.json') }}
      - name: Download documentation test data
        if: steps.docs-data-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install pooch tqdm
          python test/download_test_data.py --output-dir ./tttr-data --quiet
      - name: Set documentation version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "DOCS_VERSION=${VERSION}" >> "$GITHUB_ENV"
            echo "DOCS_LABEL=tttrlib ${VERSION}" >> "$GITHUB_ENV"
            echo "DOCS_IS_STABLE=true" >> "$GITHUB_ENV"
            echo "DOCS_DEPLOY_STABLE=true" >> "$GITHUB_ENV"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "DOCS_VERSION=stable" >> "$GITHUB_ENV"
            echo "DOCS_LABEL=stable" >> "$GITHUB_ENV"
            echo "DOCS_IS_STABLE=true" >> "$GITHUB_ENV"
            echo "DOCS_DEPLOY_STABLE=true" >> "$GITHUB_ENV"
          else
            echo "DOCS_VERSION=dev" >> "$GITHUB_ENV"
            echo "DOCS_LABEL=development" >> "$GITHUB_ENV"
            echo "DOCS_IS_STABLE=false" >> "$GITHUB_ENV"
            echo "DOCS_DEPLOY_STABLE=false" >> "$GITHUB_ENV"
          fi
      - name: Build Documentation
        run: |
          cd doc
          mkdir -p _build/api
          doxygen
          BUILD_TIER=4 sphinx-build -v -b html -T -d _build/doctrees . _build/html/stable 2>&1 | tee sphinx_build.log
          python ../tools/check_docs_pages.py _build/html/stable
          python ../tools/check_docs_coverage.py api-coverage.yml . _build/html/stable
          ls -la _build/html/stable/
          ls -la _build/html/stable/auto_examples 2>/dev/null || echo "No auto_examples directory"
          rm -rf _build/html/stable/api
          cp -r _build/api _build/html/stable/
      - name: Prepare documentation version selector
        shell: bash
        run: |
          mkdir -p doc/_build/pages-root
          cp -r doc/static_root/. doc/_build/pages-root/
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show origin/gh-pages:versions.json > /tmp/tttrlib-versions.json 2>/dev/null; then
            EXISTING=/tmp/tttrlib-versions.json
          else
            EXISTING=
          fi
          STABLE_FLAG=
          if [ "$DOCS_IS_STABLE" = "true" ]; then
            STABLE_FLAG=--stable
          fi
          VERSION_ARGS=()
          if [ -n "$EXISTING" ]; then
            VERSION_ARGS+=(--existing "$EXISTING")
          fi
          if [ -n "$STABLE_FLAG" ]; then
            VERSION_ARGS+=("$STABLE_FLAG")
          fi
          python tools/update_docs_versions.py \
            "${VERSION_ARGS[@]}" \
            --output doc/_build/pages-root/versions.json \
            --version "$DOCS_VERSION" \
            --label "$DOCS_LABEL" \
            --url "$DOCS_VERSION/index.html"
          # pydata-sphinx-theme version switcher source (header "Version" dropdown)
          python tools/make_switcher.py \
            --versions doc/_build/pages-root/versions.json \
            --output doc/_build/pages-root/switcher.json
      - uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: doc/_build/html/stable
      - name: Deploy release documentation version
        if: github.event_name == 'release'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html/stable
          keep_files: true
          destination_dir: ${{ env.DOCS_VERSION }}
      - name: Deploy stable documentation
        if: env.DOCS_DEPLOY_STABLE == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html/stable
          keep_files: true
          destination_dir: stable
      - name: Deploy dev documentation
        if: github.ref == 'refs/heads/dev'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/html/stable
          keep_files: true
          destination_dir: dev
      - name: Deploy documentation version selector
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./doc/_build/pages-root
          keep_files: true
          destination_dir: .

  # ── Publish to PyPI ─────────────────────────────────────────────────────────
  # Downloads pre-built cibuildwheel artifacts from all platforms, builds an
  # sdist, and publishes everything to PyPI.

  publish_pypi:
    name: Publish to PyPI
    needs: [build_pip_lnx, build_pip_osx_arm64, build_pip_osx_x86_64, build_pip_win,
            test_pip_lnx, test_pip_osx, test_pip_win]
    if: >
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: pip-wheels-*
          path: dist
          merge-multiple: true
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist
      - name: List packages
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # ── Publish to Conda (Windows only — Linux/macOS via bioconda) ──────────────
  # Downloads pre-built Windows conda packages and uploads to anaconda.org/tpeulen.
  # Linux and macOS conda packages are published through bioconda.

  publish_conda:
    name: Publish to Conda (Windows)
    needs: [build_conda_win, test_conda_win]
    if: >
      (github.event_name == 'release' && github.event.action == 'published') ||
      (github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download conda packages (Windows)
        uses: actions/download-artifact@v4
        with:
          pattern: conda-packages-windows-latest-*
          path: conda-bld
          merge-multiple: true
      - name: List packages
        run: find conda-bld -name '*.conda' -o -name '*.tar.bz2' | sort
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: upload
          use-mamba: true
          conda-remove-defaults: true
      - name: Upload to Conda
        shell: bash -l {0}
        run: |
          conda install -y anaconda-client -c conda-forge
          anaconda --token ${{ secrets.ANACONDA_TOKEN }} upload \
            --user tpeulen \
            --label main \
            --force \
            conda-bld/*/tttrlib-*.conda
