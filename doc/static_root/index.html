<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tttrlib documentation</title>
    <link rel="canonical" href="stable/index.html">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        color: #17202a;
        background: #f7f9fb;
      }
      main {
        max-width: 760px;
        margin: 10vh auto;
        padding: 0 24px;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 0.25rem;
      }
      p {
        line-height: 1.55;
      }
      .versions {
        display: grid;
        gap: 12px;
        margin-top: 28px;
      }
      a.version {
        display: block;
        padding: 16px 18px;
        border: 1px solid #d8e0e8;
        border-radius: 6px;
        background: white;
        color: #145a86;
        text-decoration: none;
      }
      a.version strong {
        color: #17202a;
      }
      a.version:hover {
        border-color: #87b4d6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>tttrlib documentation</h1>
      <p>Select a documentation version. The stable documentation is the
      release-oriented default.</p>
      <div id="versions" class="versions">
        <a class="version" href="stable/index.html">
          <strong>stable</strong><br>
          Current stable documentation
        </a>
      </div>
    </main>
    <script>
      fetch("versions.json", { cache: "no-store" })
        .then((response) => response.ok ? response.json() : Promise.reject())
        .then((data) => {
          const root = document.getElementById("versions");
          const versions = Array.isArray(data.versions) ? data.versions : [];
          if (!versions.length) return;
          root.innerHTML = "";
          versions.forEach((entry) => {
            const link = document.createElement("a");
            link.className = "version";
            link.href = entry.url || "stable/index.html";
            const label = entry.label || entry.version;
            const suffix = entry.stable ? "Current stable documentation" : "Archived documentation";
            link.innerHTML = "<strong>" + label + "</strong><br>" + suffix;
            root.appendChild(link);
          });
        })
        .catch(() => {});
    </script>
  </body>
</html>
